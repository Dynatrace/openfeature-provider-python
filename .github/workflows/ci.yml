name: CI

on:
    pull_request:
        branches:
            - main
    merge_group:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: astral-sh/setup-uv@d4b2f3b6ecc09d2b9be58b8a944a5b39e1e43a42 # v5.4.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - run: uv sync --frozen

            - run: uv run poe test

            - name: Type check
              if: matrix.python-version == '3.13'
              run: uv run poe mypy

            - name: Lint
              if: matrix.python-version == '3.13'
              run: uv run ruff check src tests
