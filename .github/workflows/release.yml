name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        permissions:
            contents: write
            pull-requests: write
            actions: write
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            # GITHUB_TOKEN pushes don't trigger CI (except workflow_dispatch), so start it for the release PR
            - name: Run CI on release PR
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}

        outputs:
            release_created: ${{ steps.release.outputs.release_created }}

    publish:
        runs-on: ubuntu-latest
        needs: release-please
        environment: publish
        permissions:
            contents: read
            id-token: write
        if: ${{ fromJSON(needs.release-please.outputs.release_created || false) }}

        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
              with:
                  enable-cache: false

            - run: uv build

            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  attestations: false # this can be made true once our repo is public
