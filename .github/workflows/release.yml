name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            release_pr: ${{ steps.release.outputs.pr }}

    # release-please bumps the version in pyproject.toml but has no uv.lock updater,
    # so the lockfile's self-referencing entry would go stale on every release and
    # break `uv sync --locked` for the next contributor. Sync it on the release PR.
    refresh-lockfile:
        name: Refresh uv.lock on release PR
        runs-on: ubuntu-latest
        needs: release-please
        if: ${{ needs.release-please.outputs.release_pr != '' }}
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.release_pr).headBranchName }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
              with:
                  python-version: "3.13"
                  enable-cache: false

            # Deliberately not `--upgrade`: this must only pick up the version bump
            # release-please just wrote, never re-resolve dependencies unreviewed.
            - run: uv lock

            - name: Commit refreshed lockfile
              run: |
                  if git diff --quiet uv.lock; then
                      echo "uv.lock already in sync; nothing to do"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add uv.lock
                  git commit -m "chore: sync uv.lock with released version"
                  git push

    publish:
        runs-on: ubuntu-latest
        needs: release-please
        environment: publish
        permissions:
            contents: read
        if: ${{ fromJSON(needs.release-please.outputs.release_created || false) }}

        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
              with:
                  enable-cache: false

            - run: uv build

            - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
              with:
                  password: ${{ secrets.PYPI_PUBLISH_TOKEN }}
                  attestations: false # this can be made true once our repo is public
