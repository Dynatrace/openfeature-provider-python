name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

        outputs:
            release_created: ${{ steps.release.outputs.release_created }}

    publish:
        runs-on: ubuntu-latest
        needs: release-please
        environment: publish
        permissions:
            contents: read
            id-token: write
        if: ${{ fromJSON(needs.release-please.outputs.release_created || false) }}

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: astral-sh/setup-uv@d4b2f3b6ecc09d2b9be58b8a944a5b39e1e43a42 # v5.4.0
              with:
                  enable-cache: false

            - run: uv build

            - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe3ffbf9c993bff2 # v1.12.4
              with:
                  attestations: true
