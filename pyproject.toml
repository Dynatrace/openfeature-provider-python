[build-system]
requires = ["uv_build~=0.10.0"]
build-backend = "uv_build"

[project]
name = "dynatrace-openfeature-provider-python"
version = "0.3.0"
description = "The official Dynatrace OpenFeature provider for Python"
readme = "README.md"
authors = [{ name = "Dynatrace" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["openfeature", "dynatrace", "feature-flags", "feature-management"]
dependencies = [
    "openfeature-sdk>=0.8.2",
    "openfeature-flagd-core>=2.0.0,<3.0.0",
    "requests>=2.27.0",
    # 2.3 added HTTPResponse.shutdown, which _cdn uses to enforce the fetch deadline
    "urllib3>=2.3.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/Dynatrace/openfeature-provider-python"

[dependency-groups]
dev = [
    "coverage[toml]>=7.10.0,<8.0.0",
    "mypy>=1.18.0,<2.0.0",
    "poethepoet>=0.37.0",
    "pytest>=9.0.0,<10.0.0",
    "responses>=0.25.0,<1.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.15.13",
    "types-requests>=2.32.0,<3.0.0",
    "pytest-bdd>=8.1.0,<9.0.0",
    "testcontainers>=4.13.0,<5.0.0",
]

[tool.uv.build-backend]
module-name = "dynatrace"
module-root = "src"
namespace = true

[tool.coverage.run]
omit = ["tests/**"]

[tool.mypy]
mypy_path = ["src", "tests/e2e"]
files = ["src", "tests/e2e"]
python_version = "3.10"
namespace_packages = true
explicit_package_bases = true
local_partial_types = true
allow_redefinition_new = true
fixed_format_cache = true
pretty = true
strict = true
disallow_any_generics = false

[tool.ruff]
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", "venv"]

[tool.ruff.lint]
select = [
    "A", "B", "C4", "C90", "E", "F", "FLY", "FURB", "I", "ICN003",
    "LOG", "N", "PERF", "PGH", "PLC", "PLR0913", "PLR0915",
    "RUF", "S", "SIM", "T10", "T20", "TID251", "UP", "W", "YTT",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*" = ["S101"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead"
"typing.Callable".msg = "Use collections.abc.Callable instead"
"typing.Collection".msg = "Use collections.abc.Collection instead"
"typing.Mapping".msg = "Use collections.abc.Mapping instead"
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead"
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead"
"typing.Sequence".msg = "Use collections.abc.Sequence instead"

[tool.ruff.lint.isort]
known-first-party = ["dynatrace"]

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 30

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
strict = true

[tool.poe.tasks]
test = "pytest tests --ignore=tests/e2e"
test-cov = "coverage run -m pytest tests --ignore=tests/e2e"
cov-report = "coverage xml"
cov = ["test-cov", "cov-report"]
mypy = "mypy"
lint = "ruff check src tests"
fmt = "ruff format src tests"
e2e = { sequence = [{ shell = "[ -n \"$SKIP_HARNESS_UPDATE\" ] || git submodule update --init fm-provider-test-harness" }, "pytest tests/e2e"], default_item_type = "cmd" }
